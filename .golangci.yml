version: "2"

run:
  # Таймаут на выполнение линтера. 2 минуты достаточно для проекта среднего размера.
  timeout: 2m

issues:
  # Снимаем дефолтные лимиты на количество ошибок (по умолчанию 3),
  # чтобы видеть все проблемы за один прогон, а не итерировать.
  max-issues-per-linter: 0
  max-same-issues: 0

# Форматтеры — инструменты, проверяющие/исправляющие форматирование кода.
# В v2 вынесены из linters в отдельную секцию.
formatters:
  enable:
    - gofmt          # Проверяет, что код отформатирован через gofmt.
                     # Стандартное требование Go — весь код должен быть единообразно отформатирован.
    - goimports      # Расширение gofmt: дополнительно проверяет сортировку и группировку импортов.
                     # Обеспечивает консистентный порядок импортов во всём проекте.
    - gci            # Строго задаёт порядок групп импортов и переставляет их местами.
                     # В отличие от goimports, который только группирует, gci принудительно
                     # упорядочивает: стандартная библиотека → сторонние → локальные (backend/).
  settings:
    goimports:
      # local-prefixes задаёт префикс для локальных (проектных) импортов.
      # goimports группирует импорты: стандартная библиотека, внешние зависимости, локальные пакеты.
      # Обеспечивает единообразную сортировку и группировку import-блоков во всём проекте.
      local-prefixes:
        - backend
    gci:
      # Секции задают строгий порядок групп импортов:
      # 1. standard — стандартная библиотека (context, fmt, net/http, ...)
      # 2. default — сторонние зависимости (github.com/..., google.golang.org/..., ...)
      # 3. prefix(backend) — импорты нашего проекта (backend/internal/..., backend/pkg/...)
      sections:
        - standard
        - default
        - prefix(backend)

linters:
  # default: none — выключаем все линтеры по умолчанию и явно включаем нужные.
  # Это предсказуемый подход: при обновлении golangci-lint новые линтеры не появятся неожиданно.
  default: none
  enable:
    - depguard       # Контролирует разрешённые/запрещённые зависимости (импорты пакетов).
                     # Позволяет запретить использование определённых библиотек в проекте.
    - dogsled        # Находит присваивания с избыточными blank identifiers: x, _, _, _ = f().
                     # Сигнализирует, что функция возвращает слишком много неиспользуемых значений.
    - errcheck       # Проверяет, что возвращаемые ошибки не игнорируются.
                     # Один из важнейших линтеров — пропущенная проверка ошибки может привести к panic или потере данных.
    - funlen         # Ограничивает длину функций (настроено в settings: 80 строк / 40 statements).
                     # Стимулирует декомпозицию длинных функций на более мелкие и понятные.
    - gochecknoinits # Запрещает использование функций init() в пакетах.
                     # init() создаёт неявные побочные эффекты при импорте, усложняет тестирование и понимание кода.
    - goconst        # Находит повторяющиеся строковые литералы, которые стоит вынести в константы.
                     # Уменьшает риск рассинхронизации при изменении значения в одном месте.
    - gocritic       # Мета-линтер с десятками проверок: баги, стиль, производительность.
                     # Настраивается через enabled-tags/disabled-checks в settings.
    - gocyclo        # Проверяет цикломатическую сложность функций.
                     # Ограничивает количество ветвлений — стимулирует декомпозицию сложных функций.
    - gosec          # Статический анализ безопасности: SQL-инъекции, хардкод паролей, слабая криптография.
                     # Находит типичные уязвимости из OWASP Top 10 в Go-коде.
    - govet          # Официальный vet-анализатор Go: находит подозрительные конструкции.
                     # Printf с неправильным числом аргументов, unreachable code, некорректное использование sync и т.д.
    - ineffassign    # Находит присваивания переменным, значения которых потом не используются.
                     # Часто указывает на забытую обработку ошибки или мёртвый код.
    - lll            # Ограничивает максимальную длину строки (настроено на 175 символов).
                     # Поддерживает читаемость кода при code review.
    - misspell       # Находит опечатки в комментариях и строковых литералах.
                     # Помогает поддерживать качество документации и пользовательских сообщений.
    - nakedret       # Запрещает «голые» return-ы в функциях с именованными возвращаемыми значениями.
                     # Naked returns ухудшают читаемость — неочевидно, что именно возвращается.
    - staticcheck    # Мощный статический анализатор: находит баги, проблемы производительности, deprecated API.
                     # В v2 включает в себя gosimple (S*) и stylecheck (ST*) — они больше не отдельные линтеры.
    - unconvert      # Находит ненужные преобразования типов (int(x), где x уже int).
                     # Убирает визуальный шум и упрощает код.
    - unparam        # Находит параметры функций, которые всегда вызываются с одним и тем же значением.
                     # Сигнализирует, что параметр можно заменить константой или убрать.
    - unused         # Находит неиспользуемые функции, типы, константы и переменные.
                     # Помогает держать кодовую базу чистой от мёртвого кода.
    - whitespace     # Проверяет лишние пустые строки в начале/конце функций и блоков.
                     # Поддерживает визуальную чистоту кода.
    - gochecknoglobals # Запрещает глобальные переменные (кроме ошибок и мьютексов).
                     # Глобальное состояние затрудняет тестирование и создаёт неявные зависимости.
    - dupl           # Находит дублированные блоки кода.
                     # Помогает вовремя вынести повторяющуюся логику в общую функцию.
    - gocognit       # Проверяет когнитивную сложность функций — насколько трудно понять код.
                     # Альтернатива gocyclo: учитывает вложенность и переключение контекста.
    - prealloc       # Предлагает предаллоцировать слайсы, когда размер известен заранее.
                     # make([]T, 0, n) вместо append в цикле — уменьшает аллокации и GC pressure.
    - noctx          # Проверяет, что HTTP-запросы отправляются с контекстом (http.NewRequestWithContext).
                     # Без контекста запрос нельзя отменить/ограничить по таймауту — потенциальная утечка горутин.
    - revive         # Современная замена golint — линтер стиля с гибкой настройкой правил.
                     # Проверяет именование, экспортируемые символы, обработку ошибок и другие идиоматичные паттерны.
    - goprintffuncname # Проверяет, что функции-обёртки вокруг printf заканчиваются на «f».
                     # Например: LogErrorf, не LogError, если принимают format string.
    - wsl_v5         # Whitespace Linter — следит за пустыми строками вокруг блоков (if, for, return и т.д.).
                     # Обеспечивает единый стиль визуального разделения логических блоков.
    - mnd            # Magic Number Detector — находит «магические числа» в коде.
                     # Стимулирует выносить числовые литералы в именованные константы для читаемости.

  settings:
    revive:
      # Включаем все правила, отключаем ненужные/дублирующие.
      # При обновлении revive новые полезные(и не очень) правила включатся автоматически.
      enable-all-rules: true
      rules:
        # --- Отключено: не нужно для internal/ пакетов ---
        - name: exported           # doc-комментарии — проект internal/, не публичное API
          disabled: true
        - name: package-comments   # комментарий к пакету — избыточно для internal/
          disabled: true
        - name: max-public-structs # ограничение публичных структур — нерелевантно для internal/
          disabled: true
        - name: file-header        # нет требования к заголовку файлов в проекте
          disabled: true
        - name: banned-characters  # нет запрещённых символов
          disabled: true
        # --- Отключено: дублирует другие линтеры ---
        - name: line-length-limit    # дублирует lll (с другим порогом)
          disabled: true
        - name: add-constant         # дублирует goconst, ложные срабатывания на 0/1/2
          disabled: true
        - name: cognitive-complexity  # дублирует gocognit
          disabled: true
        - name: cyclomatic           # дублирует gocyclo
          disabled: true
        - name: function-length      # дублирует funlen
          disabled: true
        - name: argument-limit       # контролируется через funlen/gocyclo
          disabled: true
        - name: confusing-naming     # публичный + приватный метод с разным регистром — стандартный паттерн Go
          disabled: true
        - name: enforce-switch-style  # не все switch нуждаются в default, особенно по enum-типам
          disabled: true
        - name: nested-structs       # анонимные вложенные структуры в DTO допустимы
          disabled: true
        - name: deep-exit            # log.Fatalf в cmd/ — контролируется exitAfterDefer
          disabled: true
        - name: imports-blocklist    # пакет errors — осознанная обёртка над stdlib
          disabled: true
        - name: package-naming      # пакет internal/errors — осознанная обёртка над stdlib errors
          disabled: true
        - name: redundant-import-alias # алиасы вроде v1 "backend/internal/handlers/v1" нужны для читаемости
          disabled: true
        - name: unhandled-error      # strings.Builder.WriteString всегда возвращает nil error
          disabled: true
        - name: unused-receiver      # ресивер нужен для привязки метода к типу (интерфейс), даже если тело не обращается к полям
          disabled: true
        - name: flag-parameter       # bool-параметры (dev, isCoursePaid) — бизнес-параметры, не control coupling
          disabled: true

    depguard:
      # depguard контролирует, какие пакеты можно/нельзя импортировать.
      # list-mode: lax — разрешено всё, кроме явно запрещённого (deny-list подход).
      rules:
        main:
          list-mode: lax
          deny:
            # reflect — медленный, небезопасный, ломает статический анализ.
            # В 99% случаев можно обойтись generics или кодогенерацией.
            - pkg: "reflect"
              desc: "reflect запрещён: используйте generics или кодогенерацию"
            # github.com/pkg/errors — устарел. В Go 1.13+ стандартный errors поддерживает
            # wrapping через fmt.Errorf("%w", err) и errors.Is/As.
            - pkg: "github.com/pkg/errors"
              desc: "используйте стандартный errors + fmt.Errorf(\"%%w\", err)"
            # log — в проекте используется структурированный логгер (pkg/logger).
            # Прямые вызовы log.Println() обходят middleware и теряют request context.
            - pkg: "log"
              desc: "используйте pkg/logger — он поддерживает structured logging и request context"
            # io/ioutil — deprecated с Go 1.16, все функции перенесены в io и os.
            - pkg: "io/ioutil"
              desc: "deprecated с Go 1.16: используйте io.ReadAll, os.ReadFile и т.д."

    dupl:
      # Порог количества токенов, при котором два блока кода считаются дубликатами.
      # 100 токенов — умеренное значение; меньше = строже, больше = мягче.
      # Помогает находить copy-paste код, который стоит вынести в общую функцию.
      threshold: 170

    govet:
      # Включает проверку затенения переменных (variable shadowing).
      # Ловит случаи, когда переменная во внутреннем блоке перекрывает одноимённую из внешнего —
      # это частый источник трудноуловимых багов (например, err := ... внутри if затеняет внешний err).
      enable:
        - shadow

    gocyclo:
      # Минимальная цикломатическая сложность функции, при которой линтер срабатывает.
      # Цикломатическая сложность считает количество независимых путей выполнения (if, for, switch case и т.д.).
      # Значение 18 — умеренное; дополнительно контролируется gocognit, учитывающий вложенность.
      min-complexity: 18

    goconst:
      # min-len: минимальная длина строкового литерала для проверки (2 символа).
      # min-occurrences: сколько раз строка должна повториться, чтобы линтер предложил вынести её в константу.
      # Помогает избежать «магических строк» — повторяющихся литералов, которые лучше заменить именованной константой.
      min-len: 2
      min-occurrences: 2

    misspell:
      # Проверяет орфографические ошибки в комментариях и строках.
      # locale: US — использует американский вариант английского (color, not colour).
      locale: US
      # cancelled — намеренное написание, совпадающее со значениями в БД
      # ("cancelled", "payment_cancelled"). Менять на "canceled" нельзя — сломает приложение.
      extra-words:
        - typo: "cancelled"
          correction: "cancelled"

    lll:
      # Максимальная длина строки кода в символах.
      # Слишком длинные строки ухудшают читаемость, особенно при code review и split-view.
      line-length: 140

    funlen:
      # Максимальная длина функции в строках и statements.
      # Длинные функции сложнее читать, тестировать и поддерживать.
      # lines: 80 — максимум строк в функции.
      # statements: 40 — максимум операторов (более точная метрика, чем строки).
      lines: 80
      statements: 40

    gocritic:
      # gocritic — мета-линтер с большим набором проверок, сгруппированных по тегам.
      # diagnostic — находит баги и подозрительный код (nil dereference, неправильное использование API).
      # experimental — экспериментальные проверки, могут давать false positives, но ловят редкие баги.
      # opinionated — проверки стиля, основанные на «мнении» сообщества (именование, идиоматичность).
      # performance — подсказки по оптимизации (лишние аллокации, неэффективные паттерны).
      # style — стилистические проверки (форматирование, идиоматичные конструкции Go).
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      # Отключённые конкретные проверки из включённых тегов:
      # hugeParam — предупреждает о передаче больших структур по значению (иногда это осознанный выбор).
      # rangeValCopy — предупреждает о копировании значений в range (часто не критично).
      # exitAfterDefer — ловит os.Exit() после defer (defer не выполнится), но бывают ложные срабатывания.
      # singleCaseSwitch — предлагает заменить switch с одним case на if (вопрос вкуса).
      # commentedOutCode — ругается на закомментированный код (иногда он нужен временно).
      disabled-checks:
        - hugeParam
        # Пока не мешают не стал отключать
        # - rangeValCopy
        # - exitAfterDefer
        # - singleCaseSwitch
        # - commentedOutCode

  exclusions:
    # presets: [] — не использовать встроенные исключения golangci-lint.
    # По умолчанию golangci-lint игнорирует ряд ошибок — отключаем, чтобы контролировать исключения явно.
    presets: []
    # Исключённые директории — не линтим сгенерированный код, бинарники и артефакты сборки.
    paths:
      - bin            # Скомпилированные бинарники.
      - build          # Артефакты сборки.
      - docs           # Автосгенерированная документация (swagger и т.д.).
    rules:
      # QF1008 предлагает убрать embedded field из селектора (event.NotificationsText.Field → event.Field).
      # Явный доступ через embedded struct улучшает читаемость — видно, к какой группе полей относится обращение.
      - text: "QF1008:"
        linters: [staticcheck]

      # runtime.Caller возвращает 4 значения, из которых обычно нужен только filename.
      # Это API стандартной библиотеки — изменить сигнатуру нельзя.
      - source: "runtime\\.Caller"
        linters: [dogsled]

      # G104 — игнорирование ошибок через _ (контролируется errcheck).
      # G404 — использование math/rand вместо crypto/rand (допустимо в проекте).
      # G115 — integer overflow при преобразовании типов (много ложных срабатываний).
      - text: "G115:"
        linters: [gosec]

      # Разрешаем игнорировать ошибки при Close, Flush, Remove, printf, Rollback и т.д.
      # Эти ошибки почти всегда безопасно игнорировать и загромождают код обработкой.
      - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv|.*Rollback). is not checked"
        linters:
          - errcheck

      # Разрешаем не проверять ошибку перед defer — defer f.Close() без проверки err допустим.
      - text: "should check returned error before deferring"
        linters:
          - errcheck

      # Разрешаем глобальные переменные с embed.FS.
      # embed.FS требует объявления на уровне пакета — это единственный способ использовать go:embed.
      - source: "embed\\.FS"
        linters: [gochecknoglobals]

      # Исключаем go:generate директивы из проверки длины строки.
      # Эти строки часто длинные из-за путей к генераторам и их нельзя разбить.
      - source: "//go:generate"
        linters: [lll]

      # Struct tags (json, validate, query, form) невозможно разбить на несколько строк.
      - source: '`(json|validate|query|form):'
        linters: [lll]

      # В тестах и моках ресиверы часто не используются — это нормально для заглушек интерфейсов.
      - path: (_test\.go|tests/)
        text: "unused-receiver:"
        linters: [revive]

      # Отключаем «шумные» линтеры в тестовых файлах и хелперах.
      # Тесты часто содержат длинные функции, дублирование, хардкод-строки — это нормально.
      - path: (_test\.go|tests/)
        linters:
          - gocyclo          # Тесты бывают сложными (table-driven tests с множеством кейсов).
          - errcheck         # В тестах часто осознанно игнорируют ошибки для краткости.
          - dupl             # Дублирование в тестах — обычная практика (copy-paste test cases).
          - gosec            # Безопасность в тестах не критична (тестовые пароли, хардкод токены).
          - funlen           # Тестовые функции часто длинные из-за setup/teardown и множества проверок.
          - goconst          # Повторяющиеся строки в тестах — это ожидаемые значения, не магические константы.
          - gocognit         # Когнитивная сложность тестов не так важна.
          - lll              # Длинные строки в тестах — часто assertion-сообщения или тестовые данные.
          - gochecknoglobals # Глобальные переменные в тестах — обычная практика (testdata, fixtures).
          - wsl_v5         # Строгие правила пустых строк в тестах только мешают.
          - prealloc       # Оптимизация аллокаций в тестах не важна.
          - noctx          # В тестах HTTP-запросы без контекста допустимы.
          - mnd            # Магические числа в тестах — фикстуры, таймауты, тестовые данные.

      # Разрешаем затенение err, ctx, log — это общепринятый паттерн в Go.
      # Переопределение err := внутри блока — идиоматичная практика.
      - linters: [govet]
        text: 'declaration of "(err|ctx|log)"'

      # В main.go разрешаем глобальные переменные, константы, длинные и сложные функции.
      # main() часто является точкой сборки приложения и неизбежно длинная.
      - path: main\.go
        linters: [gochecknoglobals, goconst, funlen, gocognit, gocyclo]

      # Файловые permissions (0o750, 0o600) — стандартная Unix-идиома, константы ухудшат читаемость.
      - source: "0o[0-7]+"
        linters: [mnd]

      # Отключаем требования к doc-комментариям во внутренних пакетах.
      # internal/ не экспортируется за пределы модуля — doc-комментарии менее критичны.
      # Включает "should have ... comment" и ST1022 (формат doc-комментариев).
      - path: internal/
        text: "(should have.+comment|ST1022:)"
        linters: [staticcheck]
