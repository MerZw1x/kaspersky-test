log:
  level: "debug"
  format: "console"

http_server:
  listen: :8000
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

graceful_timeout: 10s

database:
  # Если DATABASE_URL не задан, используется локальная БД с тестовыми реквизитами из defaults.
  dsn: ${DATABASE_URL}
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  connect_timeout: 10s
  migration_timeout: 30s

security:
  auth:
    enabled: false
  rate_limit:
    enabled: true
    requests_per_second: 10
    burst: 20
    max_clients: 10000
    idle_ttl: 10m
