log:
  level: ${LOG_LEVEL}
  format: json

http_server:
  tls:
    cert_file: "${TLS_CERT_FILE}"
    key_file: "${TLS_KEY_FILE}"
  listen: :8000
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

graceful_timeout: 10s

database:
  dsn: "${DATABASE_URL}"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  connect_timeout: 10s
  migration_timeout: 30s

security:
  auth:
    enabled: ${AUTH_ENABLED}
  rate_limit:
    enabled: true
    requests_per_second: ${RATE_LIMIT_RPS}
    burst: ${RATE_LIMIT_BURST}
    max_clients: 10000
    idle_ttl: 10m
